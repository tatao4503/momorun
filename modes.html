<!DOCTYPE html>
<html lang="ko" data-mode="selector">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#152338" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="모모런" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>모모런 버전 선택</title>
<script src="js/mode-router.js"></script>
<link rel="stylesheet" href="css/modes.css" />
</head>
<body>
<main class="mode-shell">
  <header class="mode-header">
    <div class="mode-brand">
      <div class="noa-halo" aria-hidden="true">
        <span class="halo-outer"></span>
        <span class="halo-inner"></span>
        <span class="halo-chip left"></span>
        <span class="halo-chip right"></span>
      </div>
      <div>
        <span class="mode-kicker">NOA WALKING COMPANION</span>
        <h1>모모런 버전 선택</h1>
      </div>
    </div>
    <p>오늘 걸을 방식을 선택하세요.</p>
  </header>

  <section class="mode-list" aria-label="모모런 버전">
    <article class="mode-card mode-schale" data-mode-card="schale">
      <div class="mode-art" aria-hidden="true"><span>01</span></div>
      <div class="mode-copy">
        <div class="mode-title-line">
          <div>
            <span>SCHALE · FULL</span>
            <h2>샬레 버전</h2>
          </div>
          <b data-mode-status></b>
        </div>
        <p>키보토스 산책 작전</p>
        <div class="mode-tags" aria-label="샬레 버전 주요 기능">
          <span>미션</span><span>업적</span><span>모모톡</span>
        </div>
        <a href="index.html?mode=schale" class="mode-action" data-mode-target="schale">
          <span>샬레로 시작</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
        </a>
      </div>
    </article>

    <article class="mode-card mode-lite" data-mode-card="lite">
      <div class="mode-art" aria-hidden="true"><span>02</span></div>
      <div class="mode-copy">
        <div class="mode-title-line">
          <div>
            <span>MOMOTALK · LITE</span>
            <h2>모모톡 버전</h2>
          </div>
          <b data-mode-status></b>
        </div>
        <p>가볍게 오늘 걸음만</p>
        <div class="mode-tags" aria-label="모모톡 버전 주요 기능">
          <span>걸음</span><span>목표</span><span>7일 기록</span>
        </div>
        <a href="momotalk.html" class="mode-action" data-mode-target="lite">
          <span>모모톡으로 시작</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
        </a>
      </div>
    </article>

    <article class="mode-card mode-life" data-mode-card="life">
      <div class="mode-art" aria-hidden="true"><span>03</span></div>
      <div class="mode-copy">
        <div class="mode-title-line">
          <div>
            <span>DAILY · LIFE</span>
            <h2>일상 버전</h2>
          </div>
          <b data-mode-status></b>
        </div>
        <p>아이폰 건강 기록</p>
        <div class="mode-tags" aria-label="일상 버전 주요 기능">
          <span>HealthKit</span><span>최근 기록</span><span>알림</span>
        </div>
        <a href="life.html" class="mode-action" data-mode-target="life">
          <span>일상으로 시작</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg>
        </a>
      </div>
    </article>
  </section>

  <footer class="mode-footer">
    <a href="privacy.html">개인정보 안내</a>
    <span>비공식·비상업 팬 제작물</span>
  </footer>
</main>
</body>
</html>
